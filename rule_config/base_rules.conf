[C001] 类型:冲突 来源:SEAT公理 描述:同一状态+同一事件只能有一个转移目标
条件:
  state = "*"
  event = "*"
  transfer_count = ">1"
判定:若满足条件，则标记为冲突，修正方案:{"action": "×", "transfer": "-"}

[M001] 类型:遗漏 来源:SEAT公理 描述:状态-事件组合必须定义动作与转移
条件:
  state = "*"
  event = "*"
  action_missing = true
  transfer_missing = true
判定:若满足条件，则标记为遗漏，修正方案:{"action": "/", "transfer": "-"}
